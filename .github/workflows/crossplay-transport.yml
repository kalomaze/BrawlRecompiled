name: Crossplay transport
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kalomaze/brawlonline.net
          ref: rollback-dolphin-crossplay
          path: brawl-online
          sparse-checkout: dolphin/Source/Core/Core/Brawlback/include/gekkonet/GekkoLib/include
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/online/requirements.txt
      - run: cmake -S tools/online/tests -B build-transport -DGEKKONET_INCLUDE=${{ github.workspace }}/brawl-online/dolphin/Source/Core/Core/Brawlback/include/gekkonet/GekkoLib/include
      - run: cmake --build build-transport --config Release
      - run: ctest --test-dir build-transport -C Release --output-on-failure
